openapi: 3.1.0
info:
  title: sepiano piano service
  version: "1"
  description: |
    The API of `sepianod`, the service that drives a Stahnke SE reproducing
    piano from a Raspberry Pi. The web UI and the future iOS app both use it.

    * Home network only, no authentication.
    * JSON in and out unless noted. Errors are `{"error": "..."}` with a 4xx/5xx
      status.
    * Live state comes from `GET /events` (Server-Sent Events). Clients should
      render from the `status` events and use the POST replies only to report
      errors.
servers:
  - url: /api/v1

paths:
  /status:
    get:
      summary: Current deck state
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }

  /events:
    get:
      summary: Live updates (Server-Sent Events)
      description: |
        `text/event-stream`. The first event is always a `status`. Event types:

        * `status`: data is a Status object. Sent on every change, and about
          5 times a second while the position moves.
        * `console`: data is `{"line": "..."}`, one line of text the piano's
          program printed.
        * `library`: data is `{"id": "..."}` (empty id = many changes). The
          library changed; refetch what you show.
        * `notice`: data is `{"level": "info"|"warn"|"error", "text": "..."}`,
          a message worth showing briefly (e.g. "recording saved").

        A comment line (`: ping`) is sent every 15 s to keep proxies awake.
      responses:
        "200": { description: Event stream, content: { text/event-stream: {} } }

  /deck/play:
    post:
      summary: Play a piece, an album or a play list
      description: |
        Give exactly one of `piece`, `album`, `playlist` or `pieces`.

        Several tracks play as **one continuous performance**: the service
        joins their files, each with its own short lead-in, so there is no
        pause to upload the player between tracks. `start` (0-based) begins
        at a later track. For an album, each track plays in the preferred
        rendering (Steinway first; see Settings.preferred_instrument).

        If something is already playing it is stopped first. Returns at once
        (202) with the deck in `loading`; follow progress on `/events`. The
        upload of the player program takes about 2 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                piece: { type: string, description: Piece id }
                album: { type: string, description: "Album name, as in Album.name" }
                playlist: { type: string, description: Play list id }
                pieces: { type: array, items: { type: string }, description: Piece ids, played in this order }
                title: { type: string, description: "Name shown for `pieces` (default: the first piece's title)" }
                start: { type: integer, minimum: 0, description: Track to begin with (0-based) }
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { description: Piano offline or player program missing, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /deck/next:
    post:
      summary: Skip to the next track of the album or play list
      description: Plays the collection again from the next track (a pause of a few seconds while the player uploads).
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "409": { description: Nothing playing, or already the last track, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /deck/previous:
    post:
      summary: Back to the start of this track, or to the previous track
      description: Within the first 5 seconds of a track, goes to the previous track; otherwise starts the current track again.
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }

  /albums:
    get:
      summary: Albums
      description: |
        Pieces grouped by their `album` field, in track order. Where a track
        exists in several renderings, the preferred one is listed and
        `renderings` counts them all.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums: { type: array, items: { $ref: "#/components/schemas/AlbumSummary" } }
  /albums/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string }, description: "Album.name, URL-escaped" }
    get:
      summary: One album with its tracks
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Album" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /playlists:
    get:
      summary: Play lists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlists: { type: array, items: { $ref: "#/components/schemas/PlaylistSummary" } }
    post:
      summary: Create a play list
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, pieces: { type: array, items: { type: string } }, source: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /playlists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One play list with its pieces
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Rename a play list or replace its pieces
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, pieces: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a play list (its pieces stay in the library)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /deck/pause:
    post:
      summary: Pause (the player's Space key)
      description: Waits until the piano confirms ("STOP PLAYING AT TIME=…").
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /deck/resume:
    post:
      summary: Resume after a pause (Space again)
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /deck/stop:
    post:
      summary: Stop playing (the player's Enter key)
      description: If the piano does not confirm, the service drops the link, which also stops the program.
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
  /deck/restart:
    post:
      summary: Restart the piece from the beginning (the player's Esc key)
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /deck/level:
    post:
      summary: Change the volume level
      description: |
        The level is the player's own "subdue" setting: 0 plays as recorded,
        -1, -2, … play softer. It cannot go above 0. Give either `delta`
        (usually +1 or -1) or an absolute `level`. Works while idle too: the
        level is applied when the next piece starts, and it is remembered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta: { type: integer }
                level: { type: integer, maximum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /record/arm:
    post:
      summary: Prepare to record
      description: |
        Uploads the recorder program. The deck goes `loading`, then `armed`
        when the piano is ready. Recording starts with `/record/start`.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { title: { type: string } } } } }
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /record/start:
    post:
      summary: Start recording (Space)
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
  /record/stop:
    post:
      summary: Stop recording and save (Enter)
      description: The deck goes `saving`, then `idle`. A `library` event and a `notice` announce the new piece.
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
  /record/discard:
    post:
      summary: Abandon an armed or running recording without saving
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }

  /pieces:
    get:
      summary: List the library
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Words to match in title, composer, performer, album, notes, file name, instrument, date and .kb header text }
        - { name: composer, in: query, schema: { type: string } }
        - { name: performer, in: query, schema: { type: string } }
        - { name: instrument, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pieces: { type: array, items: { $ref: "#/components/schemas/Piece" } }
    post:
      summary: Upload pieces
      description: |
        `multipart/form-data` with one or more `file` parts. Accepted:
        a `.kb` + `.lp` + `.sp` set (same base name), a `.zip` of sets, or a
        `.mid`/`.midi` file (converted; the original is kept). An optional
        `title` field names a single MIDI upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: array, items: { type: string, format: binary } }
                title: { type: string }
      responses:
        "200":
          description: Result per item
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: array, items: { $ref: "#/components/schemas/Piece" } }
                  duplicates: { type: array, items: { $ref: "#/components/schemas/Piece" }, description: Already in the library (same .kb contents) }
                  errors: { type: array, items: { type: object, properties: { name: { type: string }, error: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }

  /pieces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One piece
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Piece" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Edit metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of these fields. Each field set here is locked, so re-reading the files never changes it again.
              properties:
                title: { type: string }
                composer: { type: string }
                performer: { type: string }
                recorded_on: { type: string }
                instrument: { type: string }
                notes: { type: string }
                album: { type: string }
                track: { type: integer, minimum: 0 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Piece" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a piece and its files
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: The piece is playing, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /pieces/{id}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: format, in: query, schema: { type: string, enum: [se, midi], default: se } }
    get:
      summary: Download a piece
      description: "`se`: a .zip holding the .kb/.lp/.sp set under its original name. `midi`: a Standard MIDI File."
      responses:
        "200": { description: File, content: { application/zip: {}, audio/midi: {} } }
        "404": { $ref: "#/components/responses/Error" }

  /export:
    get:
      summary: Back up the whole library as one .zip
      responses:
        "200": { description: Zip, content: { application/zip: {} } }

  /library/rescan:
    post:
      summary: Re-read the library folder (after files were copied in by hand)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { pieces: { type: integer } } } } } }

  /instrument:
    get:
      summary: Connection details and diagnostics
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Instrument" } } } }

  /programs/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, enum: [play, record, getlut, anykey, anyham, midiin, sustain, adjust, cal, silent, setup] } }
    put:
      summary: Install a suite program (play.exe, record.exe, getlut.exe or a tool's program)
      description: |
        The body is the .exe itself (`application/octet-stream`), or
        `multipart/form-data` with a `file` part. The Z80 program inside is
        checked before the file is kept. These programs are copyrighted and are
        never part of sepiano: each owner supplies their own copy.
      requestBody:
        required: true
        content:
          application/octet-stream: {}
          multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } }
      responses:
        "200": { description: Installed, content: { application/json: { schema: { $ref: "#/components/schemas/Program" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /settings:
    get:
      summary: Settings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    put:
      summary: Change settings (fields left out are kept)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }

  /piano/table:
    get:
      summary: The piano's stored settings, from a backup of its EEPROM table
      description: |
        The latest backup, or the one named by `backup`. Read only: nothing
        here changes the piano. See docs/SETTINGS-EDITOR.md.
      parameters:
        - { name: backup, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PianoView" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /piano/backups:
    get:
      summary: The backups of the piano's settings, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups: { type: array, items: { $ref: "#/components/schemas/PianoBackup" } }
                  retriever: { $ref: "#/components/schemas/Program" }
    post:
      summary: Read the piano's settings now and keep them
      description: |
        Runs getlut.exe on the piano (it reads the EEPROM and moves nothing),
        while the piano is idle; the deck shows `maintenance` meanwhile. It
        takes a few seconds. The reply says how the table differs from the
        previous backup.
      responses:
        "201":
          description: Kept
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup: { $ref: "#/components/schemas/PianoBackup" }
                  previous: { $ref: "#/components/schemas/PianoBackup" }
                  same_as_previous: { type: boolean }
                  changes: { $ref: "#/components/schemas/PianoDiff" }
                  console: { type: array, items: { type: string } }
                  problem: { type: string }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /piano/backups/{id}:
    get:
      summary: Download a backup's .lut file (2048 bytes)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The table image, content: { application/octet-stream: {} } }
        "404": { $ref: "#/components/responses/Error" }

  /piano/compare:
    get:
      summary: How one backup differs from another, in words
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: "#/components/schemas/PianoBackup" }
                  to: { $ref: "#/components/schemas/PianoBackup" }
                  diff: { $ref: "#/components/schemas/PianoDiff" }

  /piano/voicing:
    get:
      summary: Software voicing (trims applied while serving; nothing written to the piano)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Voicing" } } } }
    put:
      summary: Replace the software voicing
      description: |
        Trims are in the table's own steps (+1 adds 5 to the hammer speed,
        128000 / velocity; positive is louder), keyed by MIDI note. `offset`
        applies to every key. They take effect from the next piece played
        (`/deck/replay` replays the current track at once).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                on: { type: boolean }
                offset: { type: integer }
                trims: { type: object, additionalProperties: { type: integer } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Voicing" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /piano/audition:
    post:
      summary: Play test notes for one key
      description: |
        At four dynamics (velocity 64, 100, 256, 400), the note as recorded
        and then with a trim: `trim` if given, else the key's software trim
        plus the offset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: integer, minimum: 21, maximum: 108 }
                trim: { type: integer }
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /deck/replay:
    post:
      summary: Play the current track again from its start (to hear a voicing change)
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }

  /pieces/{id}/keys:
    get:
      summary: The velocities each key has in a piece (for a recording, what each hammer sensor measured)
      description: |
        Per key: how often it plays, its velocities' range and median, and how
        far its median hammer speed (128000 / velocity) stands from its
        neighbours'. Outliers are keys at least `threshold` % apart. Record
        each key a few times at the same loudness to check the sensors.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  piece: { type: object }
                  origin: { type: string }
                  check:
                    type: object
                    properties:
                      notes: { type: integer }
                      median: { type: integer }
                      threshold: { type: number }
                      keys: { type: array, items: { $ref: "#/components/schemas/KeyStat" } }
                      outliers: { type: array, items: { $ref: "#/components/schemas/KeyStat" } }
        "404": { $ref: "#/components/responses/Error" }

  /tools:
    get:
      summary: The suite's other programs, run from the app
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        file: { type: string }
                        title: { type: string }
                        does: { type: string }
                        risk: { type: string, enum: [reads, moves, writes] }
                        keys: { type: array, items: { type: string } }
                        input: { type: boolean, description: it asks for typed answers }
                        warning: { type: string }
                        present: { type: boolean }
                        banner: { type: string }
                        error: { type: string }

  /tools/{name}/start:
    post:
      summary: Start a tool on the piano (it must be idle)
      description: |
        A tool whose `risk` is `writes` needs `confirm: true`; the service then
        backs up the piano's settings (reason `before-tool`) before starting
        it. The deck shows `maintenance` while the tool runs; its text arrives
        as `console` events.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { confirm: { type: boolean } } } } }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { $ref: "#/components/schemas/Status" }
                  backup: { $ref: "#/components/schemas/PianoBackup" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /tools/key:
    post:
      summary: Send a key, or typed text followed by Enter, to the running tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, enum: [space, enter, esc, up, down, left, right] }
                text: { type: string }
      responses:
        "204": { description: Sent }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /tools/stop:
    post:
      summary: Stop the running tool at once
      responses:
        "200": { $ref: "#/components/responses/Status" }

  /sim/power:
    post:
      summary: "Simulator only: switch the simulated piano on or off"
      description: Exists only when the service runs with `-simulate`.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [on], properties: { on: { type: boolean } } } } }
      responses:
        "200": { description: OK }
        "404": { description: Not running the simulator }

components:
  responses:
    Status:
      description: The deck state after the command
      content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    State:
      type: string
      description: |
        * `offline`: the piano does not answer (power off, cable). The service keeps retrying.
        * `connecting`: opening the link.
        * `idle`: connected, nothing running.
        * `loading`: uploading a program to the piano (about 2 s).
        * `playing`, `paused`
        * `stopping`: stop requested, waiting for the program to finish.
        * `armed`: recorder loaded, waiting for `/record/start`.
        * `recording`
        * `saving`: recording stopped, files being written.
        * `maintenance`: a utility program (getlut.exe) is reading the piano's settings.
        * `fault`: something went wrong; `message` says what. The service recovers by itself.
      enum: [offline, connecting, idle, loading, playing, paused, stopping, armed, recording, saving, maintenance, fault]

    Status:
      type: object
      required: [state, online, position_ms, duration_ms, level, target_level, since]
      properties:
        state: { $ref: "#/components/schemas/State" }
        online: { type: boolean, description: The link to the piano is up }
        piece:
          description: The track playing now (for an album or play list, the current track); null when idle
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/PieceRef" }]
        collection:
          description: The album or play list being played; null for a single piece
          oneOf:
            - { type: "null" }
            - type: object
              properties:
                kind: { type: string, enum: [album, playlist, list] }
                id: { type: string, description: "Album name, play list id, or empty for a list of pieces" }
                title: { type: string }
                start: { type: integer, description: "Index in the whole collection of tracks[0]" }
                count: { type: integer, description: Tracks in the whole collection }
        tracks:
          type: array
          description: |
            What the performance now playing is made of, in order: one entry
            for a single piece, several for an album or play list (from
            `collection.start` on). Times are within the whole performance.
          items:
            type: object
            properties:
              piece: { $ref: "#/components/schemas/PieceRef" }
              start_ms: { type: integer }
              duration_ms: { type: integer }
        track_index: { type: integer, description: Index in `tracks` of the track playing now }
        position_ms: { type: integer, description: "Position in the whole performance, from the piano's own 800 Hz clock" }
        duration_ms: { type: integer, description: Length of the whole performance }
        level: { type: integer, description: The level the player last reported (0 = as recorded) }
        target_level: { type: integer, description: The level the service applies at the start of each piece }
        min_level: { type: [integer, "null"], description: Lowest level the player accepts, once discovered }
        message: { type: string, description: Fault or warning text, empty when all is well }
        recording_title: { type: string, description: Title for the recording in progress }
        program: { type: string, description: Banner of the program running on the piano }
        voiced: { type: boolean, description: The performance playing carries software voicing }
        simulated: { type: boolean, description: True when talking to the built-in simulator }
        since: { type: string, format: date-time, description: When the state last changed }

    PieceRef:
      type: object
      properties:
        source_name: { type: string, description: "The file it came from (base name), shown to check what plays" }
        id: { type: string }
        title: { type: string }
        composer: { type: string }
        performer: { type: string }

    Piece:
      type: object
      required: [id, title, duration_ms, origin, added_at]
      properties:
        id: { type: string, description: "8 characters; also the base name of the files on the Pi" }
        title: { type: string }
        composer: { type: string }
        performer: { type: string }
        recorded_on: { type: string, description: "YYYY-MM-DD, YYYY-MM or YYYY, as precisely as known" }
        instrument: { type: string, description: "Rendering instrument, e.g. Steinway_SED133291" }
        perf_key: { type: string, description: "Same value for every rendering of one performance; group by it" }
        duration_ms: { type: integer }
        notes: { type: string }
        origin: { type: string, enum: [import, upload, midi, recorded] }
        source_name: { type: string, description: The original file base name }
        header_text: { type: string, description: Text stored in the .kb header (often a copyright line) }
        kb_sha256: { type: string }
        has_midi_source: { type: boolean, description: The piece was converted from an uploaded MIDI file, which is kept }
        album: { type: string, description: "Album and catalog number, e.g. \"Earl Wild: The Art of the Transcription (FP-1002)\"" }
        track: { type: integer, description: Track number on the album, 0 when none }
        locked: { type: array, items: { type: string }, description: Fields set by hand or from a catalog; never re-derived from the files }
        meta_version: { type: integer, description: Version of the parser that described the piece }
        added_at: { type: string, format: date-time }

    AlbumSummary:
      type: object
      properties:
        name: { type: string, description: "e.g. \"Earl Wild: The Art of the Transcription (FP-1002)\"; also its id" }
        performer: { type: string, description: The performer of most tracks }
        composer: { type: string, description: The composer of most tracks }
        tracks: { type: integer }
        duration_ms: { type: integer, description: The tracks played in their preferred renderings }

    Album:
      allOf:
        - { $ref: "#/components/schemas/AlbumSummary" }
        - type: object
          properties:
            tracks:
              type: array
              items:
                type: object
                properties:
                  track: { type: integer, description: Track number on the album }
                  piece: { $ref: "#/components/schemas/Piece" }
                  renderings: { type: integer, description: "Versions of this track in the library (1 = just this one)" }

    PlaylistSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string, description: "Where it was imported from, e.g. \"SE/Hamb/playGould55.bat\"" }
        tracks: { type: integer }
        duration_ms: { type: integer }

    Playlist:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }
        duration_ms: { type: integer }
        pieces: { type: array, items: { $ref: "#/components/schemas/Piece" }, description: "In play order; pieces deleted from the library are left out" }

    Settings:
      type: object
      properties:
        preferred_instrument: { type: string, description: "Rendering to prefer when a performance has several" }
        level: { type: integer, maximum: 0, description: "Default level (same as target_level)" }

    Program:
      type: object
      properties:
        present: { type: boolean }
        banner: { type: string }
        error: { type: string }

    Instrument:
      type: object
      properties:
        port: { type: string }
        baud: { type: integer }
        online: { type: boolean }
        simulated: { type: boolean }
        link:
          type: object
          properties:
            rx_bytes: { type: integer }
            tx_bytes: { type: integer }
            retransmits: { type: integer }
            naks: { type: integer }
            connected_since: { type: [string, "null"], format: date-time }
            last_error: { type: string }
        programs:
          type: object
          properties:
            play: { $ref: "#/components/schemas/Program" }
            record: { $ref: "#/components/schemas/Program" }
            getlut: { $ref: "#/components/schemas/Program" }
        console: { type: array, items: { type: string }, description: The last lines the piano's program printed }
        version: { type: string }

    PianoBackup:
      type: object
      properties:
        id: { type: string, description: "YYYYMMDD-HHMMSS-reason, local time" }
        time: { type: string, format: date-time }
        reason: { type: string, description: "manual or imported (later before-write, after-write)" }
        size: { type: integer }
        sha256: { type: string }
        model: { type: string }
        version: { type: string }
        valid: { type: boolean }
        problem: { type: string }

    PianoView:
      type: object
      description: A table in plain terms (docs/SUITE-PROGRAMS.md has every field's meaning)
      properties:
        backup: { $ref: "#/components/schemas/PianoBackup" }
        name: { type: string }
        version: { type: string }
        version_ok: { type: boolean }
        length: { type: integer }
        bottom: { type: integer, description: MIDI note of the first key }
        top: { type: integer }
        settings:
          type: object
          properties:
            serial: { type: string }
            discard_silent: { type: boolean }
            german_names: { type: boolean }
            first_note: { type: integer }
            last_note: { type: integer }
            first_calibration: { type: boolean }
        breakpoints: { type: array, items: { type: integer }, description: SE velocities }
        trims_on: { type: boolean }
        hold_level: { type: integer }
        velocities: { type: array, items: { type: integer }, description: where each key's curve is sampled }
        keys:
          type: array
          items:
            type: object
            properties:
              note: { type: integer }
              name: { type: string }
              trim: { type: integer }
              lead: { type: array, items: { type: integer }, description: "section 1, per breakpoint (ticks)" }
              level: { type: array, items: { type: integer }, description: "section 2, per breakpoint (smaller is harder)" }
              silent_level: { type: integer }
              release: { type: array, items: { type: integer }, description: the 60- and 120-tick release levels }
              free_release: { type: integer, description: ticks }
              curve: { type: array, items: { type: array, items: { type: integer } }, description: "[lead, level] at each of `velocities`" }
              trim_effect:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    velocity: { type: integer }
                    becomes: { type: integer }
                    speed_pct: { type: number }
              flags: { type: array, items: { type: string, enum: [gentlest, slow] } }
        player:
          type: array
          items:
            type: object
            properties:
              offset: { type: integer }
              value: { type: integer }
              factory: { type: integer }
              label: { type: string }
              explain: { type: string }
        notes:
          type: array
          items:
            type: object
            properties:
              level: { type: string, enum: [info, warn, danger] }
              text: { type: string }
              keys: { type: array, items: { type: string } }

    PianoDiff:
      type: object
      properties:
        bytes: { type: integer, description: bytes that differ in the whole image }
        changes:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              what: { type: string }
              from: { type: string }
              to: { type: string }
        other: { type: integer, description: differing bytes not described by changes }

    Voicing:
      type: object
      properties:
        on: { type: boolean }
        offset: { type: integer, description: trim steps for every key }
        trims: { type: object, additionalProperties: { type: integer }, description: trim steps by MIDI note }
        active: { type: boolean, description: on and changing something }
        max_trim: { type: integer }
        keys:
          type: array
          items:
            type: object
            properties:
              note: { type: integer }
              name: { type: string }
              trim: { type: integer }

    KeyStat:
      type: object
      properties:
        note: { type: integer }
        name: { type: string }
        count: { type: integer }
        min: { type: integer }
        max: { type: integer }
        median: { type: integer }
        spread: { type: number, description: "the middle half's range in hammer speed, % of the median" }
        deviation: { type: number, description: "% hammer speed against the neighbouring keys; positive records louder" }
