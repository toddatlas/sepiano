<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11100e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Piano">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Piano</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" id="back" href="#/library" hidden>Library</a>
    <span class="wordmark">Piano</span>
    <span class="badge sim-badge" id="sim-badge" hidden>Simulator</span>
  </header>
  <div class="banner" id="banner" role="status" hidden></div>

  <main id="view" tabindex="-1"></main>

  <div class="mini" id="mini" hidden></div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="now" data-icon="now" title="Now Playing"><span>Now Playing</span></a>
    <a href="#/library" data-tab="library" data-icon="library" title="Library"><span>Library</span></a>
    <a href="#/record" data-tab="record" data-icon="record" title="Record"><span>Record</span></a>
    <a href="#/piano" data-tab="piano" data-icon="piano" title="Piano"><span>Piano</span></a>
    <a href="#/status" data-tab="status" data-icon="status" title="Status"><span>Status</span></a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirm-cancel" type="button">Cancel</button>
        <button class="btn btn-danger-solid" id="confirm-ok" type="button">OK</button>
      </div>
    </form>
  </dialog>

  <noscript><p class="noscript">This app needs JavaScript.</p></noscript>
</body>
</html>
